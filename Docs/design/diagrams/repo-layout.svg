<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#2563eb"/>
    </marker>
    <marker id="dash" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#9a3412"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="620" fill="#ffffff"/>

  <text x="28" y="36" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1a1a1a">Layers — dependency direction</text>
  <text x="330" y="76" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444">solid arrows: may depend on (downward only)</text>
  <text x="330" y="94" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#9a3412">dashed lines: defined contracts, not links</text>

  <!-- Center column -->
  <rect x="340" y="110" width="240" height="44" rx="8" fill="#e6f4ea" stroke="#444"/>
  <text x="460" y="137" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">apps</text>
  <rect x="340" y="184" width="240" height="44" rx="8" fill="#e8f0fe" stroke="#444"/>
  <text x="460" y="211" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">frameworks</text>
  <rect x="340" y="258" width="240" height="44" rx="8" fill="#e6f4ea" stroke="#444"/>
  <text x="460" y="285" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">server</text>
  <rect x="340" y="332" width="240" height="44" rx="8" fill="#e8f0fe" stroke="#444"/>
  <text x="460" y="359" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">foundation</text>
  <rect x="340" y="406" width="240" height="44" rx="8" fill="#e8f0fe" stroke="#444"/>
  <text x="460" y="433" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">kernel</text>
  <rect x="340" y="490" width="240" height="44" rx="8" fill="#f5f5f4" stroke="#444"/>
  <text x="460" y="517" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Hardware</text>
  <text x="460" y="530" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" dy="-2">x86_64 · arm64 · riscv64</text>

  <!-- Downward dependency arrows -->
  <line x1="460" y1="154" x2="460" y2="178" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="460" y1="228" x2="460" y2="252" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="460" y1="302" x2="460" y2="326" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="460" y1="376" x2="460" y2="400" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="460" y1="450" x2="460" y2="484" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Left column: Boot, Compat -->
  <rect x="60" y="300" width="200" height="44" rx="8" fill="#e6f4ea" stroke="#444"/>
  <text x="160" y="327" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">bootloader</text>
  <rect x="60" y="420" width="200" height="44" rx="8" fill="#e6f4ea" stroke="#444"/>
  <text x="160" y="447" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">compat</text>

  <!-- Contracts (dashed) -->
  <line x1="260" y1="322" x2="334" y2="416" stroke="#9a3412" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#dash)"/>
  <text x="70" y="290" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#9a3412">boot_args contract</text>
  <line x1="260" y1="442" x2="334" y2="436" stroke="#9a3412" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#dash)"/>
  <text x="70" y="486" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#9a3412">KPI surface only,</text>
  <text x="70" y="502" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#9a3412">never links foundation</text>

  <!-- Right column: Tools, Tests, Docs -->
  <rect x="660" y="258" width="200" height="60" rx="8" fill="#f5f5f4" stroke="#444"/>
  <text x="760" y="283" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">tools (rv)</text>
  <text x="760" y="302" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">builds all, linked by none</text>
  <rect x="660" y="332" width="200" height="60" rx="8" fill="#f5f5f4" stroke="#444"/>
  <text x="760" y="357" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">tests</text>
  <text x="760" y="376" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">links all, depended on by none</text>
  <rect x="660" y="406" width="200" height="44" rx="8" fill="#f5f5f4" stroke="#444"/>
  <text x="760" y="433" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">docs</text>

  <text x="28" y="580" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444">Figure: dependencies point down the center column only; bootloader and compat stand outside it behind contracts,</text>
  <text x="28" y="598" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444">and the build harness (rv) owns and enforces the graph.</text>
</svg>
