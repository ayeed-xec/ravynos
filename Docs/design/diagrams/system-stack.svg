<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="700" fill="#ffffff"/>

  <text x="28" y="36" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1a1a1a">ravynOS system stack</text>

  <!-- Legend -->
  <rect x="560" y="24" width="16" height="16" fill="#e8f0fe" stroke="#444"/>
  <text x="584" y="37" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1a1a1a">Apple open source</text>
  <rect x="710" y="24" width="16" height="16" fill="#e6f4ea" stroke="#444"/>
  <text x="734" y="37" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1a1a1a">ours</text>
  <rect x="790" y="24" width="16" height="16" fill="#fdeeee" stroke="#444"/>
  <text x="814" y="37" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1a1a1a">hard gap</text>

  <!-- startup direction arrow -->
  <line x1="86" y1="628" x2="86" y2="130" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="60" y="390" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#2563eb" text-anchor="middle" transform="rotate(-90 60 390)">startup</text>

  <!-- Layer 1: Applications (ours) -->
  <rect x="120" y="86" width="440" height="50" rx="8" fill="#e6f4ea" stroke="#444"/>
  <text x="340" y="111" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Applications</text>
  <text x="340" y="128" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">our Apps/ + unmodified Mac binaries</text>
  <text x="590" y="116" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444">ours; third-party apps must run as-is</text>

  <!-- Layer 2: Frameworks (Apple source + our fills) -->
  <rect x="120" y="146" width="440" height="50" rx="8" fill="#e8f0fe" stroke="#444"/>
  <text x="340" y="171" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Frameworks</text>
  <text x="340" y="188" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">AppKit · CoreGraphics · CoreText</text>
  <text x="590" y="176" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444">Apple source + our clean-room fills</text>

  <!-- Layer 3: WindowServer (hard gap, ours) -->
  <rect x="120" y="206" width="440" height="50" rx="8" fill="#fdeeee" stroke="#444"/>
  <text x="340" y="231" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">WindowServer</text>
  <text x="340" y="248" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">compositor · native protocol · GPU drivers</text>
  <text x="590" y="236" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444">hard gap — ours, clean-room</text>

  <!-- Layer 4: Metal (hard gap) -->
  <rect x="120" y="266" width="440" height="50" rx="8" fill="#fdeeee" stroke="#444"/>
  <text x="340" y="291" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Metal</text>
  <text x="340" y="308" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">API surface · shading · compiler backend</text>
  <text x="590" y="296" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444">hard gap — headers public, impl ours</text>

  <!-- Layer 5: Darwin core userland (Apple) -->
  <rect x="120" y="326" width="440" height="50" rx="8" fill="#e8f0fe" stroke="#444"/>
  <text x="340" y="351" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Darwin core userland</text>
  <text x="340" y="368" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">dyld · libc · libpthread · libdispatch · launchd</text>
  <text x="590" y="356" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444">Apple open source, our patches</text>

  <!-- Layer 6: XNU + port layers -->
  <rect x="120" y="386" width="300" height="50" rx="8" fill="#e8f0fe" stroke="#444"/>
  <text x="270" y="411" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">XNU kernel (vendored)</text>
  <text x="270" y="428" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">xnu-13432.41.4 line</text>
  <rect x="430" y="386" width="130" height="50" rx="8" fill="#e6f4ea" stroke="#444"/>
  <text x="495" y="416" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">port layers</text>
  <text x="495" y="430" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">(ours)</text>
  <text x="590" y="416" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444">Apple kernel source + our</text>
  <text x="590" y="432" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444">machine-dependent ports</text>

  <!-- Layer 7: APFS / storage (hard gap) -->
  <rect x="120" y="446" width="440" height="50" rx="8" fill="#fdeeee" stroke="#444"/>
  <text x="340" y="471" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">APFS / storage</text>
  <text x="340" y="488" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">boot volume must be APFS; HFS+/ext4 secondary</text>
  <text x="590" y="476" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444">hard gap — impl closed;</text>
  <text x="590" y="492" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444">clean-room</text>

  <!-- Layer 8: Bootloader (ours) -->
  <rect x="120" y="506" width="440" height="50" rx="8" fill="#e6f4ea" stroke="#444"/>
  <text x="340" y="531" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Bootloader</text>
  <text x="340" y="548" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">UEFI app · boot_args · real driver model</text>
  <text x="590" y="536" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444">ours — reference: PureDarwin</text>
  <text x="590" y="552" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444">xnu-loader</text>

  <!-- Layer 9: UEFI firmware (vendor) -->
  <rect x="120" y="566" width="440" height="50" rx="8" fill="#f5f5f4" stroke="#444"/>
  <text x="340" y="591" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">UEFI firmware</text>
  <text x="340" y="608" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">vendor-supplied · OVMF under QEMU</text>
  <text x="590" y="596" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444">vendor; we define the minimum</text>
  <text x="590" y="612" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444">services we require</text>

  <text x="28" y="660" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444">Figure: red layers (WindowServer, Metal, APFS) are closed upstream and are filled by clean-room work;</text>
  <text x="28" y="678" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444">blue layers come from Apple's open-source releases; green layers are ours from the start.</text>
</svg>
