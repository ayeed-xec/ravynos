<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="560" fill="#ffffff"/>

  <text x="28" y="36" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1a1a1a">One harness, many hosts and targets</text>

  <!-- Build hosts column -->
  <text x="60" y="72" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1a1a1a">Build hosts</text>
  <rect x="60" y="86" width="200" height="40" rx="8" fill="#f5f5f4" stroke="#444"/>
  <text x="160" y="111" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">Linux (primary)</text>
  <rect x="60" y="138" width="200" height="40" rx="8" fill="#f5f5f4" stroke="#444"/>
  <text x="160" y="163" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">FreeBSD</text>
  <rect x="60" y="190" width="200" height="40" rx="8" fill="#f5f5f4" stroke="#444"/>
  <text x="160" y="215" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">ravynOS (self-host)</text>
  <rect x="60" y="242" width="200" height="40" rx="8" fill="#f5f5f4" stroke="#444"/>
  <text x="160" y="267" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">Windows</text>
  <rect x="60" y="294" width="200" height="40" rx="8" fill="#f5f5f4" stroke="#444"/>
  <text x="160" y="319" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">macOS</text>

  <!-- Harness -->
  <rect x="350" y="160" width="230" height="130" rx="8" fill="#e6f4ea" stroke="#444"/>
  <text x="465" y="188" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Tools/ build harness</text>
  <text x="465" y="212" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">dependency graph</text>
  <text x="465" y="232" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">per-target cross toolchains</text>
  <text x="465" y="252" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">license + build-state audits</text>
  <text x="465" y="272" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">bootstraps: host != target</text>

  <!-- Targets column -->
  <text x="680" y="72" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1a1a1a">Targets</text>
  <rect x="680" y="86" width="180" height="40" rx="8" fill="#e8f0fe" stroke="#444"/>
  <text x="770" y="111" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">x86_64</text>
  <rect x="680" y="138" width="180" height="40" rx="8" fill="#e8f0fe" stroke="#444"/>
  <text x="770" y="163" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">arm64</text>
  <rect x="680" y="190" width="180" height="40" rx="8" fill="#e8f0fe" stroke="#444"/>
  <text x="770" y="215" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">riscv64</text>
  <rect x="680" y="260" width="180" height="40" rx="8" fill="#f5f5f4" stroke="#444"/>
  <text x="770" y="285" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">QEMU / real hardware</text>

  <!-- Host -> harness arrows -->
  <line x1="260" y1="106" x2="344" y2="196" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="260" y1="158" x2="344" y2="212" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="260" y1="210" x2="344" y2="226" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="260" y1="262" x2="344" y2="244" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="260" y1="314" x2="344" y2="262" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Harness -> target arrows -->
  <line x1="580" y1="190" x2="674" y2="106" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="580" y1="215" x2="674" y2="158" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="580" y1="240" x2="674" y2="210" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Targets -> test loop -->
  <line x1="770" y1="230" x2="770" y2="254" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="60" y="400" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1a1a1a">Commitment levels (see 01-principles.md):</text>
  <text x="60" y="424" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1a1a1a">primary = fails the build on regression; committed = tested per change;</text>
  <text x="60" y="444" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1a1a1a">best effort = fixed when reported; not planned = recorded decision.</text>

  <text x="60" y="490" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#9a3412">Today: x86_64 Linux hosts, 8 CPUs, 16 GB RAM, no GPU.</text>
  <text x="60" y="510" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#9a3412">Every other cell is cross-compiled or QEMU-emulated for tests.</text>

  <text x="28" y="538" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444">Figure: host and target are independent axes; the harness bootstraps each toolchain,</text>
  <text x="28" y="556" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444">so no host is anchored to the OS it builds.</text>
</svg>
