<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="700" fill="#ffffff"/>
  <text x="24" y="36" font-size="16" font-weight="bold" fill="#1a1a1a">kite bootloader architecture</text>

  <!-- Firmware -->
  <rect x="310" y="60" width="280" height="52" rx="8" fill="#f5f5f4" stroke="#444"/>
  <text x="450" y="82" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Firmware</text>
  <text x="450" y="100" font-size="12" text-anchor="middle" fill="#1a1a1a">UEFI / DT platform / SBI</text>

  <!-- Core -->
  <rect x="150" y="146" width="600" height="96" rx="8" fill="#e8f0fe" stroke="#444"/>
  <text x="450" y="168" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Core</text>
  <text x="450" y="188" font-size="12" text-anchor="middle" fill="#1a1a1a">UEFI entry point, module registry, allocator</text>
  <text x="450" y="206" font-size="12" text-anchor="middle" fill="#1a1a1a">memory map handling, page tables, boot log</text>
  <text x="450" y="224" font-size="12" text-anchor="middle" fill="#1a1a1a">TPM measurement, NVRAM and boot-argument handling</text>

  <line x1="450" y1="112" x2="450" y2="142" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Module directory -->
  <rect x="60" y="276" width="780" height="120" rx="8" fill="#e6f4ea" stroke="#444"/>
  <text x="450" y="298" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Module directory</text>

  <rect x="90" y="312" width="220" height="68" rx="8" fill="#f5f5f4" stroke="#444"/>
  <text x="200" y="332" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Filesystem drivers</text>
  <text x="200" y="350" font-size="12" text-anchor="middle" fill="#1a1a1a">FAT (ESP) - APFS - ext4</text>
  <text x="200" y="368" font-size="12" text-anchor="middle" fill="#1a1a1a">GPT / MBR</text>

  <rect x="340" y="312" width="220" height="68" rx="8" fill="#f5f5f4" stroke="#444"/>
  <text x="450" y="332" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Console</text>
  <text x="450" y="350" font-size="12" text-anchor="middle" fill="#1a1a1a">graphical (GOP / DT fb)</text>
  <text x="450" y="368" font-size="12" text-anchor="middle" fill="#1a1a1a">serial</text>

  <rect x="590" y="312" width="220" height="68" rx="8" fill="#f5f5f4" stroke="#444"/>
  <text x="700" y="332" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Filesystem protocols</text>
  <text x="700" y="350" font-size="12" text-anchor="middle" fill="#1a1a1a">publish kite drivers as</text>
  <text x="700" y="368" font-size="12" text-anchor="middle" fill="#1a1a1a">UEFI protocols for other apps</text>

  <line x1="450" y1="242" x2="450" y2="272" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="450" y1="272" x2="450" y2="242" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Platform layer -->
  <rect x="60" y="430" width="780" height="92" rx="8" fill="#fdeeee" stroke="#444"/>
  <text x="450" y="452" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Platform layer (one per architecture: hand-off, memory map, early console)</text>

  <rect x="90" y="464" width="220" height="44" rx="8" fill="#f5f5f4" stroke="#444"/>
  <text x="200" y="483" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">x86_64</text>
  <text x="200" y="500" font-size="12" text-anchor="middle" fill="#1a1a1a">EFI map, ACPI, 64 to 32 switch</text>

  <rect x="340" y="464" width="220" height="44" rx="8" fill="#f5f5f4" stroke="#444"/>
  <text x="450" y="483" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">arm64</text>
  <text x="450" y="500" font-size="12" text-anchor="middle" fill="#1a1a1a">UEFI or DT, DTB build</text>

  <rect x="590" y="464" width="220" height="44" rx="8" fill="#f5f5f4" stroke="#444"/>
  <text x="700" y="483" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">riscv64</text>
  <text x="700" y="500" font-size="12" text-anchor="middle" fill="#1a1a1a">SBI, UEFI-on-SBI, DT</text>

  <line x1="450" y1="396" x2="450" y2="426" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Kernel loader backends -->
  <rect x="60" y="556" width="780" height="82" rx="8" fill="#e6f4ea" stroke="#444"/>
  <text x="450" y="578" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Kernel-loader backends (one interface)</text>

  <rect x="130" y="590" width="300" height="38" rx="8" fill="#f5f5f4" stroke="#444"/>
  <text x="280" y="607" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">XNU loader</text>
  <text x="280" y="622" font-size="12" text-anchor="middle" fill="#1a1a1a">Mach-O kernel / kernelcache, boot_args</text>

  <rect x="470" y="590" width="300" height="38" rx="8" fill="#f5f5f4" stroke="#444"/>
  <text x="620" y="607" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">ELF loader</text>
  <text x="620" y="622" font-size="12" text-anchor="middle" fill="#1a1a1a">our test kernels and benchmarks</text>

  <line x1="450" y1="522" x2="450" y2="552" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="450" y="672" font-size="12" font-style="italic" text-anchor="middle" fill="#1a1a1a">Parsing, menu, drivers and modules are shared code; hand-off, memory map and early console are per architecture.</text>
</svg>
