<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 830" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#2563eb"/>
    </marker>
    <pattern id="stripes" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#fef9ec"/>
      <rect width="4" height="8" fill="#fde68a"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="900" height="830" fill="#ffffff"/>
  <text x="30" y="36" font-size="16" font-weight="bold" fill="#1a1a1a">Filesystem stack, colored by provenance</text>

  <!-- legend -->
  <rect x="520" y="52" width="350" height="96" rx="8" fill="#f5f5f4" stroke="#444"/>
  <rect x="536" y="66" width="18" height="14" fill="#e6f4ea" stroke="#444"/>
  <text x="564" y="78" font-size="12" fill="#1a1a1a">our clean-room code</text>
  <rect x="536" y="92" width="18" height="14" fill="#e8f0fe" stroke="#444"/>
  <text x="564" y="104" font-size="12" fill="#1a1a1a">Apple open source, vendored or ported</text>
  <rect x="536" y="118" width="18" height="14" fill="url(#stripes)" stroke="#444"/>
  <text x="564" y="130" font-size="12" fill="#1a1a1a">compat-path driver (03-kernel.md)</text>

  <!-- frameworks -->
  <rect x="170" y="170" width="560" height="60" rx="8" fill="#e8f0fe" stroke="#444"/>
  <text x="450" y="194" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Frameworks — AppKit · Foundation · CoreServices</text>
  <text x="450" y="214" font-size="12" text-anchor="middle" fill="#1a1a1a">consume the POSIX/vnode surface; filesystem-agnostic</text>

  <!-- BSD layer -->
  <rect x="170" y="252" width="560" height="56" rx="8" fill="#e8f0fe" stroke="#444"/>
  <text x="450" y="276" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">BSD layer (vendored xnu)</text>
  <text x="450" y="296" font-size="12" text-anchor="middle" fill="#1a1a1a">POSIX syscalls, fsctl, vnode pager clients</text>

  <!-- VFS -->
  <rect x="170" y="330" width="560" height="64" rx="8" fill="#e8f0fe" stroke="#444"/>
  <text x="450" y="354" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">xnu VFS (vendored xnu)</text>
  <text x="450" y="374" font-size="12" text-anchor="middle" fill="#1a1a1a">vfsops · vnodeops · name cache · buffer cache · vnode pager</text>

  <!-- backend row -->
  <rect x="170" y="418" width="170" height="70" rx="8" fill="#e6f4ea" stroke="#444"/>
  <text x="255" y="445" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">APFS backend</text>
  <text x="255" y="465" font-size="12" text-anchor="middle" fill="#1a1a1a">our VFS plug-in</text>
  <rect x="356" y="418" width="120" height="70" rx="8" fill="#e8f0fe" stroke="#444"/>
  <text x="416" y="445" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">HFS+ (read)</text>
  <text x="416" y="465" font-size="12" text-anchor="middle" fill="#1a1a1a">Apple's open hfs</text>
  <rect x="492" y="418" width="100" height="70" rx="8" fill="#e6f4ea" stroke="#444"/>
  <text x="542" y="445" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">FAT</text>
  <text x="542" y="465" font-size="12" text-anchor="middle" fill="#1a1a1a">native, small</text>
  <rect x="608" y="418" width="122" height="70" rx="8" fill="url(#stripes)" stroke="#444"/>
  <text x="669" y="445" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">NTFS · ext4</text>
  <text x="669" y="465" font-size="12" text-anchor="middle" fill="#1a1a1a">compat path</text>

  <!-- libapfs -->
  <rect x="170" y="512" width="560" height="120" rx="8" fill="#e6f4ea" stroke="#444"/>
  <text x="450" y="538" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">libapfs — one on-disk format implementation (clean-room)</text>
  <text x="450" y="558" font-size="12" text-anchor="middle" fill="#1a1a1a">structures validated against a corpus made with Apple's own tools</text>
  <rect x="190" y="574" width="260" height="44" rx="8" fill="#ffffff" stroke="#444"/>
  <text x="320" y="592" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">userland tools</text>
  <text x="320" y="610" font-size="12" text-anchor="middle" fill="#1a1a1a">mkapfs · fsapfs · verify · repair</text>
  <rect x="470" y="574" width="240" height="44" rx="8" fill="#ffffff" stroke="#444"/>
  <text x="590" y="592" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">bootloader reader</text>
  <text x="590" y="610" font-size="12" text-anchor="middle" fill="#1a1a1a">freestanding, no libc</text>

  <!-- encryption -->
  <rect x="170" y="656" width="560" height="52" rx="8" fill="#e6f4ea" stroke="#444"/>
  <text x="450" y="678" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">volume encryption — our AES-XTS block filter</text>
  <text x="450" y="698" font-size="12" text-anchor="middle" fill="#1a1a1a">below the filesystem, dm-crypt-style; same code for encrypted and plain</text>

  <!-- block drivers -->
  <rect x="170" y="732" width="560" height="52" rx="8" fill="#e6f4ea" stroke="#444"/>
  <text x="450" y="754" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">block drivers — NVMe · AHCI · virtio</text>
  <text x="450" y="774" font-size="12" text-anchor="middle" fill="#1a1a1a">our driver substrate (03-kernel.md)</text>

  <!-- arrows -->
  <line x1="450" y1="732" x2="450" y2="710" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="450" y1="656" x2="450" y2="634" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="255" y1="512" x2="255" y2="490" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="255" y1="418" x2="255" y2="396" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="416" y1="418" x2="416" y2="396" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="542" y1="418" x2="542" y2="396" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="669" y1="418" x2="669" y2="396" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="450" y1="330" x2="450" y2="310" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="450" y1="252" x2="450" y2="232" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="30" y="812" font-size="12" fill="#1a1a1a">One format implementation, three frontends — a format bug is found once. APFS is our clean-room work; xnu and hfs are Apple's open source; NTFS and ext4 ride the compat path.</text>
</svg>
