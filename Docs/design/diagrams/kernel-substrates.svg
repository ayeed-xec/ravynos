<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="700" fill="#ffffff"/>
  <text x="30" y="36" font-size="16" font-weight="bold" fill="#1a1a1a">Kernel core and substrates</text>

  <!-- xnu core -->
  <rect x="170" y="60" width="560" height="130" rx="8" fill="#e8f0fe" stroke="#444"/>
  <text x="450" y="88" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">xnu core — one vendored source tree</text>
  <rect x="190" y="105" width="120" height="66" rx="8" fill="#ffffff" stroke="#444"/>
  <text x="250" y="131" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">osfmk</text>
  <text x="250" y="150" font-size="12" text-anchor="middle" fill="#1a1a1a">Mach, VM, arch</text>
  <rect x="325" y="105" width="120" height="66" rx="8" fill="#ffffff" stroke="#444"/>
  <text x="385" y="131" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">bsd</text>
  <text x="385" y="150" font-size="12" text-anchor="middle" fill="#1a1a1a">VFS, net, POSIX</text>
  <rect x="460" y="105" width="120" height="66" rx="8" fill="#ffffff" stroke="#444"/>
  <text x="520" y="131" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">iokit</text>
  <text x="520" y="150" font-size="12" text-anchor="middle" fill="#1a1a1a">driver families</text>
  <rect x="595" y="105" width="120" height="66" rx="8" fill="#ffffff" stroke="#444"/>
  <text x="655" y="131" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">libkern</text>
  <text x="655" y="150" font-size="12" text-anchor="middle" fill="#1a1a1a">C++ runtime</text>

  <!-- patch series band -->
  <rect x="170" y="212" width="560" height="44" rx="8" fill="#e6f4ea" stroke="#444"/>
  <text x="450" y="239" font-size="13" text-anchor="middle" fill="#1a1a1a">our quilt patch series, applied by the build harness</text>

  <!-- boundary -->
  <line x1="30" y1="315" x2="870" y2="315" stroke="#444" stroke-dasharray="6,5"/>
  <text x="30" y="306" font-size="12" fill="#1a1a1a">per-substrate boundary</text>

  <!-- arrows from core to substrates -->
  <line x1="300" y1="256" x2="235" y2="340" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="600" y1="256" x2="665" y2="340" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="140" y="300" font-size="12" fill="#1a1a1a">same source,</text>
  <text x="140" y="317" font-size="12" fill="#1a1a1a">one image per arch</text>
  <text x="700" y="300" font-size="12" fill="#1a1a1a">same source,</text>
  <text x="700" y="317" font-size="12" fill="#1a1a1a">cross-compiled</text>

  <!-- bare-metal targets -->
  <rect x="40" y="340" width="380" height="280" rx="8" fill="#f5f5f4" stroke="#444"/>
  <text x="60" y="368" font-size="13" font-weight="bold" fill="#1a1a1a">Bare-metal kernel targets (what ships)</text>
  <rect x="60" y="385" width="340" height="62" rx="8" fill="#e8f0fe" stroke="#444"/>
  <text x="80" y="411" font-size="13" font-weight="bold" fill="#1a1a1a">x86_64</text>
  <text x="80" y="431" font-size="12" fill="#1a1a1a">UEFI, 4-level tables, IDT</text>
  <rect x="60" y="460" width="340" height="62" rx="8" fill="#e8f0fe" stroke="#444"/>
  <text x="80" y="486" font-size="13" font-weight="bold" fill="#1a1a1a">arm64</text>
  <text x="80" y="506" font-size="12" fill="#1a1a1a">UEFI or device tree, VBAR_EL1</text>
  <rect x="60" y="535" width="340" height="62" rx="8" fill="#e6f4ea" stroke="#444"/>
  <text x="80" y="561" font-size="13" font-weight="bold" fill="#1a1a1a">riscv64</text>
  <text x="80" y="576" font-size="12" fill="#1a1a1a">SBI firmware, Sv48, new osfmk/riscv port</text>
  <text x="80" y="591" font-size="12" fill="#9a3412">largest kernel work item — no Apple reference</text>

  <!-- build and test hosts -->
  <rect x="480" y="340" width="390" height="280" rx="8" fill="#f5f5f4" stroke="#444"/>
  <text x="500" y="368" font-size="13" font-weight="bold" fill="#1a1a1a">Build and test hosts (not runtime layers)</text>
  <rect x="500" y="385" width="350" height="62" rx="8" fill="#f5f5f4" stroke="#444"/>
  <text x="520" y="411" font-size="13" font-weight="bold" fill="#1a1a1a">Linux host</text>
  <text x="520" y="431" font-size="12" fill="#1a1a1a">cross-compile with clang, our mig</text>
  <rect x="500" y="460" width="350" height="62" rx="8" fill="#f5f5f4" stroke="#444"/>
  <text x="520" y="486" font-size="13" font-weight="bold" fill="#1a1a1a">FreeBSD host</text>
  <text x="520" y="506" font-size="12" fill="#1a1a1a">build parity, no runtime role</text>
  <rect x="500" y="535" width="350" height="62" rx="8" fill="#f5f5f4" stroke="#444"/>
  <text x="520" y="561" font-size="13" font-weight="bold" fill="#1a1a1a">QEMU</text>
  <text x="520" y="581" font-size="12" fill="#1a1a1a">per-arch boot and driver tests in CI</text>

  <text x="30" y="668" font-size="12" fill="#1a1a1a">The kernel runs on bare metal; Linux and FreeBSD are build and test hosts, not runtime layers.</text>
</svg>
