# SPDX-License-Identifier: BSD-2-Clause
name: ci

on:
  push:
    branches: [main, darwin-clean, 'wp/**']
  pull_request:
    branches: [main, darwin-clean]

jobs:
  gates:
    name: rv gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang lld llvm
          rustup component add rustfmt

      - name: Stage-1 build tools cache key
        id: buildtools
        run: |
          key=$(bash Tools/toolchain/buildtools/key.sh)
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Restore the stage-1 build tools
        uses: actions/cache@v4
        with:
          path: build/toolchain/buildtools-${{ steps.buildtools.outputs.key }}
          key: stage1-buildtools-${{ steps.buildtools.outputs.key }}

      - name: Stage-1 build tools (byacc, unifdef, rvpatch, mkfat, elf2pe, mig)
        run: |
          cargo run --locked --quiet --manifest-path Tools/rv/Cargo.toml -- bootstrap buildtools
          Tools/toolchain/buildtools.sh --print-bin >> "$GITHUB_PATH"

      - name: byacc and rvpatch resolve to stage 1, not the host
        run: |
          bin=$(Tools/toolchain/buildtools.sh --print-bin)
          for tool in byacc unifdef rvpatch mig; do
            [ "$(command -v "$tool")" = "$bin/$tool" ] || {
              echo "$tool resolves to $(command -v "$tool"), expected $bin/$tool"
              exit 1
            }
          done

      - name: Host tool gate (no GPL program in the build)
        run: |
          bash -n Tools/ci/check-host-tools.sh
          shellcheck Tools/ci/check-host-tools.sh
          Tools/ci/check-host-tools.sh

      - name: Lint the CI scripts
        run: |
          bash -n Tools/ci/check-format.sh
          shellcheck Tools/ci/check-format.sh
          bash -n Tools/ci/check-spdx.sh
          shellcheck Tools/ci/check-spdx.sh
          bash -n Tools/ci/check-commit-subjects.sh
          shellcheck Tools/ci/check-commit-subjects.sh
          bash -n Tools/ci/check-macho.sh
          shellcheck Tools/ci/check-macho.sh

      - name: SPDX identifiers on every file we own
        run: Tools/ci/check-spdx.sh

      - name: Commit subjects in this change
        run: Tools/ci/check-commit-subjects.sh 'HEAD^..HEAD'

      - name: Host tool unit tests (rvpatch, mkfat, elf2pe)
        run: |
          shellcheck Tests/tools/run.sh
          Tests/tools/run.sh

      - name: Build the rv harness
        run: cargo build --locked --manifest-path Tools/rv/Cargo.toml

      - name: rv unit tests
        run: cargo test --locked --manifest-path Tools/rv/Cargo.toml

      - name: rv lints
        run: cargo clippy --locked --manifest-path Tools/rv/Cargo.toml --all-targets -- -D warnings

      - name: rv test (runs every Tests/**/test.toml)
        run: cargo run --locked --quiet --manifest-path Tools/rv/Cargo.toml -- test

      - name: Commands whose tool is not built yet exit 3
        run: |
          for cmd in kernelcache codesign symbolicate; do
            code=0
            Tools/rv/target/debug/rv "$cmd" || code=$?
            if [ "$code" -ne 3 ]; then
              echo "$cmd exited $code, expected 3 (E-NOT-BUILT)"
              exit 1
            fi
          done

      - name: Vendored trees match their pins
        run: cargo run --locked --manifest-path Tools/rv/Cargo.toml -- vendors check

      - name: rv build (discovers components from their manifests)
        run: |
          cargo run --locked --manifest-path Tools/rv/Cargo.toml -- build -t x86_64-ravynos
          cargo run --locked --manifest-path Tools/rv/Cargo.toml -- build -t arm64-ravynos

      # A format check only: hello and hello-cli are Mach-O files that make Linux
      # system calls, not Darwin programs (GAP-07).
      - name: Linked outputs pass the S02 Mach-O assertion
        run: |
          for arch in x86_64 arm64; do
            Tools/ci/check-macho.sh "build/$arch-ravynos/libhello/libhello.dylib" "$arch" DYLIB
            Tools/ci/check-macho.sh "build/$arch-ravynos/hello/hello" "$arch" EXECUTE
            Tools/ci/check-macho.sh "build/$arch-ravynos/hello-cli/hello-cli" "$arch" EXECUTE
          done

      - name: rv audit license
        run: cargo run --locked --manifest-path Tools/rv/Cargo.toml -- audit license

      - name: Negative fixtures fail as designed
        run: |
          RV="$PWD/Tools/rv/target/debug/rv" bash Tests/rv/negative/run.sh

      - name: mig builds from the pinned tree plus its patches
        run: Tools/mig/build.sh --out "$RUNNER_TEMP/mig" --smoke

      - name: xnuhook plans the byacc parsers (S05)
        run: |
          cargo test --locked --manifest-path Tools/xnuhook/Cargo.toml
          cargo clippy --locked --manifest-path Tools/xnuhook/Cargo.toml --all-targets -- -D warnings

  gates-image:
    name: gates in the pinned image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Build the gate image
        run: docker build -f Tools/ci/Containerfile -t ravynos-gates Tools/ci

      - name: Run every gate inside it
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: /src
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            -e GIT_CONFIG_COUNT -e GIT_CONFIG_KEY_0 -e GIT_CONFIG_VALUE_0 \
            ravynos-gates bash -eu -c '
              want=$(sed -n "s/^channel = \"\(.*\)\"/\1/p" rust-toolchain.toml)
              rustc --version | grep -q "^rustc $want " || {
                echo "image rustc $(rustc --version) is not rust-toolchain.toml $want"; exit 1; }
              Tools/toolchain/buildtools.sh
              PATH="$(Tools/toolchain/buildtools.sh --print-bin):$PATH"
              Tools/ci/check-format.sh
              Tools/ci/check-spdx.sh
              Tools/ci/check-host-tools.sh
              Tools/ci/check-commit-subjects.sh "HEAD^..HEAD"
              Tests/tools/run.sh
              cargo build --locked --manifest-path Tools/rv/Cargo.toml
              cargo test --locked --manifest-path Tools/rv/Cargo.toml
              cargo clippy --locked --manifest-path Tools/rv/Cargo.toml --all-targets -- -D warnings
              cargo test --locked --manifest-path Tools/xnuhook/Cargo.toml
              for t in x86_64-ravynos arm64-ravynos; do
                Tools/rv/target/debug/rv build -t "$t"
              done
              for arch in x86_64 arm64; do
                Tools/ci/check-macho.sh "build/$arch-ravynos/libhello/libhello.dylib" "$arch" DYLIB
                Tools/ci/check-macho.sh "build/$arch-ravynos/hello-cli/hello-cli" "$arch" EXECUTE
              done
            '

  boot:
    name: boot smokes (QEMU TCG)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install QEMU and firmware
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang lld llvm \
            qemu-system-x86 qemu-system-arm qemu-system-misc qemu-system-riscv \
            ovmf qemu-efi-aarch64 qemu-efi-riscv64 opensbi

      - name: x86_64 boot smoke
        run: Tests/boot/smoke.sh

      - name: Mach-O loader smoke
        run: Tests/boot/smoke-macho.sh

      - name: arm64 boot smoke
        run: Tests/boot/smoke-arm64.sh

      - name: riscv64 boot smoke
        run: Tests/boot/smoke-riscv64.sh

  format:
    name: clang-format / rustfmt gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format
          rustup component add rustfmt

      - name: Check formatting
        run: Tools/ci/check-format.sh
