#
# Every gate runs inside the image built from Tools/ci/Containerfile
# (SYSTEM-DESIGN.md 2.2, 5.6): its base, packages and Rust are pinned, and it
# holds no bison, flex or m4. Nothing here installs from the runner's apt.
name: ci

on:
  push:
    branches: [main, darwin-clean, 'wp/**']
  pull_request:
    branches: [main, darwin-clean]

jobs:
  gates:
    name: gates in the pinned image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build the gate image
        run: docker build -f Tools/ci/Containerfile -t ravynos-gates Tools/ci

      # Every commit the push brings is checked, not only the last one. A new
      # branch has no "before"; its commits are the ones darwin-clean lacks.
      - name: Commit range of this push
        id: range
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # A pull request checks out GitHub's synthetic merge commit; the range
          # ends at the branch head so that commit is not judged.
          if [ -n "$BASE" ]; then
            range="$BASE..$HEAD_SHA"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] \
              && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..HEAD"
          else
            range="origin/darwin-clean..HEAD"
          fi
          echo "range=$range" >> "$GITHUB_OUTPUT"

      - name: Run every gate inside it
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/src \
            ravynos-gates Tools/ci/gates.sh "${{ steps.range.outputs.range }}"

  boot:
    name: boot smokes in the pinned image (QEMU TCG)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the gate image
        run: docker build -f Tools/ci/Containerfile -t ravynos-gates Tools/ci

      - name: x86_64, Mach-O, arm64 and riscv64 smokes
        run: |
          docker run --rm -v "$PWD:/src" -w /src ravynos-gates bash -eu -c '
            Tests/boot/smoke.sh
            Tests/boot/smoke-macho.sh
            Tests/boot/smoke-arm64.sh
            Tests/boot/smoke-riscv64.sh
          '
