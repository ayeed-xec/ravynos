#
# Stage 1, build-tools component (SYSTEM-DESIGN.md S02): `rv bootstrap
# buildtools` builds byacc, unifdef, rvpatch, mkfat, elf2pe and mig into
# build/toolchain/buildtools-<key>/, and `rv bootstrap --verify buildtools`
# rebuilds them in a second job and compares hashes. It never touches LLVM.
# Caches are branch-scoped (see stage1-llvm.yml).
name: stage1-buildtools

on:
  push:
    branches: [darwin, main, darwin-clean, 'wp/**']
    paths:
      - 'Tools/toolchain/buildtools.sh'
      - 'Tools/toolchain/buildtools/**'
      - 'Tools/mig/**'
      - 'Boot/mkfat/**'
      - 'Boot/elf2pe/**'
      - 'Tools/rv/src/bootstrap.rs'
      - 'VENDORS'
      - '.github/workflows/stage1-buildtools.yml'
  schedule:
    - cron: '41 3 * * 1'
  workflow_dispatch:

jobs:
  bootstrap:
    name: rv bootstrap buildtools
    runs-on: ubuntu-latest
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v4

      - name: Stage 0 (host clang and lld)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld

      - name: Cache key
        id: key
        run: |
          key=$(bash Tools/toolchain/buildtools/key.sh)
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Restore the build-tools component
        uses: actions/cache@v4
        with:
          path: build/toolchain/buildtools-${{ steps.key.outputs.key }}
          key: stage1-buildtools-${{ steps.key.outputs.key }}

      - name: rv bootstrap buildtools
        run: cargo run --locked --quiet --manifest-path Tools/rv/Cargo.toml -- bootstrap buildtools

  verify:
    name: rv bootstrap --verify buildtools
    needs: bootstrap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage 0 (host clang and lld)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld

      - name: The key matches the bootstrap job
        run: test "$(bash Tools/toolchain/buildtools/key.sh)" = "${{ needs.bootstrap.outputs.key }}"

      - name: Restore the build-tools component
        uses: actions/cache/restore@v4
        with:
          path: build/toolchain/buildtools-${{ needs.bootstrap.outputs.key }}
          key: stage1-buildtools-${{ needs.bootstrap.outputs.key }}
          fail-on-cache-miss: true

      - name: rv bootstrap --verify buildtools
        run: cargo run --locked --quiet --manifest-path Tools/rv/Cargo.toml -- bootstrap --verify buildtools
