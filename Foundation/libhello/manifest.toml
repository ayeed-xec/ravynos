name    = "libhello"
layer   = "foundation"
license = "BSD-2-Clause"
state   = "working"
kind    = "dylib"

sources = [
    "src/**.c",
    "src/**.h",
    "include/**.h",
]

install_name          = "/usr/lib/libhello.dylib"
current_version       = "1.0.0"
compatibility_version = "1.0.0"

deps.internal = []

# No riscv64: its Mach-O target needs the LLVM patch of ADR-03 first.
targets = ["x86_64-ravynos", "arm64-ravynos"]

[exports]
headers = ["include/**.h"]
libs    = ["libhello.dylib"]
